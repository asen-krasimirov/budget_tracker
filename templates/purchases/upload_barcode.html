{% extends '../base.html' %}

{% block content %}
<h2>Add a Purchase</h2>

{% if form.errors %}
    <div style="color: red; border: 1px solid red; padding: 10px; margin-bottom: 10px;">
        <strong>Error:</strong>
        <ul>
            {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <label><input type="radio" name="input_option" id="upload-option" checked> Upload Image</label>
    <label><input type="radio" name="input_option" id="capture-option"> Capture Photo</label>
    <label><input type="radio" name="input_option" id="manual-option"> Enter Barcode Manually</label>

    <br><br>

    <div id="upload-container">
        <label>Upload Image:</label>
        {{ form.image }}
    </div>

    <div id="camera-container" style="display: none;">
        <video id="video" width="300" height="200" autoplay></video>
        <button type="button" id="capture-btn">Capture Photo</button>
        <canvas id="canvas" width="300" height="200" style="display: none;"></canvas>
        <input type="hidden" name="captured_image" id="captured_image">  <!-- Stores captured image -->
    </div>

    <div id="manual-container" style="display: none;">
        <label>Enter Barcode:</label>
        <input type="text" name="manual_barcode" id="manual_barcode" placeholder="Enter barcode number">
    </div>

    <br><br>
    <button type="submit" id="scan-btn">Proceed</button>
</form>

{% load static %}
<script src="{% static 'scripts/barcode_handler.js' %}"></script>

{% endblock %}
