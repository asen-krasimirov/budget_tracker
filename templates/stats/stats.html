{% extends '../base.html' %}

{% block content %}
<h2>Purchase Statistics ({{ USER_CURRENCY }})</h2>

<!-- Filter Options -->
<div>
    <label for="filter">View Statistics By:</label>
    <select id="filter">
        <option value="monthly">Monthly</option>
        <option value="weekly">Weekly</option>
        <option value="daily">Daily</option>
        <option value="category">Category</option>
    </select>
</div>

<!-- Chart Container -->
<canvas id="statsChart" width="400" height="200"></canvas>

<!-- Most & Least Bought -->
<div>
    <h3>Product Trends</h3>
    <p><strong>Most Bought Product:</strong> <span id="mostBought"></span></p>
    <p><strong>Least Bought Product:</strong> <span id="leastBought"></span></p>
</div>

<!-- ✅ Send Report Button -->
<div style="margin-top: 20px; text-align: center;">
    <button id="sendReportButton" class="btn">📧 Send Report via Email</button>
    <p id="emailMessage" style="color: green; display: none;">✔ Report Sent Successfully!</p>
</div>

<!-- Include Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% load static %}

<script>
    var statsDataUrl = "{% url 'stats_data' %}"; // ✅ Define it globally before external JS loads
    var sendReportUrl = "{% url 'send_report' %}";
    var csrfToken = "{{ csrf_token }}";
</script>

<script src="{% static 'scripts/stats_handler.js' %}"></script>
<script src="{% static 'scripts/email_report_handler.js' %}"></script>

{% endblock %}
